user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush     on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name _;

        # Serve Next.js static export from /usr/share/nginx/html
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Handle API requests - proxy to Laravel
        location /api/ {
            alias /var/www/html/public;
            try_files $uri $uri/ @laravel;
        }

        # Handle Laravel specific routes if any (e.g. sanctum/csrf-cookie)
        location /sanctum/ {
            alias /var/www/html/public;
            try_files $uri $uri/ @laravel;
        }
        
        # Named location for Laravel
        location @laravel {
            root /var/www/html/public;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
            fastcgi_param  PATH_INFO        $fastcgi_path_info;
            
            # Pass proxy headers to Laravel
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTPS $http_x_forwarded_proto;
        }

        # Serve static (Next) for everything else
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Bookkeeping logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}
